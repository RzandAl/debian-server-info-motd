name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify executable modes
        run: |
          test -x install.sh
          test -x etc/update-motd.d/10-server-info
          test -x usr/local/bin/server-info

      - name: Verify Bash syntax
        run: |
          bash -n install.sh
          bash -n etc/update-motd.d/10-server-info
          bash -n usr/local/bin/server-info

      - name: Verify SHA-256 checksums
        run: sha256sum -c SHA256SUMS

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck \
            install.sh \
            etc/update-motd.d/10-server-info \
            usr/local/bin/server-info
