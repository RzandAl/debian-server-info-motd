name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify executable modes
        run: |
          test -x install.sh
          test -x etc/update-motd.d/10-server-info
          test -x tests/test-last-login-management.sh
          test -x usr/local/bin/server-info

      - name: Verify project version
        run: |
          test -f VERSION
          test "$(wc -l < VERSION)" -eq 1
          grep -Eq \
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            VERSION

      - name: Verify installer options
        run: |
          bash install.sh --help >/dev/null
          bash install.sh --debug --source-ref v0.1.0 --help >/dev/null

          set +e
          bash install.sh --source-ref ../main --help >/dev/null 2>&1
          invalid_ref_status=$?
          bash install.sh \
            --source-ref main \
            --source-ref main \
            --help >/dev/null 2>&1
          duplicate_ref_status=$?
          set -e

          test "$invalid_ref_status" -eq 2
          test "$duplicate_ref_status" -eq 2

      - name: Verify Bash syntax
        run: |
          bash -n install.sh
          bash -n etc/update-motd.d/10-server-info
          bash -n usr/local/bin/server-info

      - name: Verify output behavior
        run: |
          output_dir=$(mktemp -d)
          trap 'rm -rf -- "$output_dir"' EXIT

          motd_output="$output_dir/motd"
          manual_output="$output_dir/manual"

          etc/update-motd.d/10-server-info > "$motd_output"
          etc/update-motd.d/10-server-info --manual > "$manual_output"

          awk '
              /^  System type:/ {
                  if ((getline next_line) <= 0 ||
                      next_line !~ /^  Uptime:/) {
                      exit 1
                  }

                  found = 1
              }

              END {
                  if (!found) {
                      exit 1
                  }
              }
          ' "$motd_output"

          grep -Eq \
            '^  CPU:[[:space:]].* \([0-9]+%\)$' \
            "$motd_output"
          ! grep -q '^Welcome to ' "$manual_output"

          test "$(
              tail -c 2 "$motd_output" |
                  od -An -tx1 |
                  tr -d '[:space:]'
          )" = '0a0a'
          test "$(
              tail -c 1 "$manual_output" |
                  od -An -tx1 |
                  tr -d '[:space:]'
          )" = '0a'
          test "$(
              tail -c 2 "$manual_output" |
                  od -An -tx1 |
                  tr -d '[:space:]'
          )" != '0a0a'

      - name: Verify SHA-256 checksums
        run: sha256sum -c SHA256SUMS

      - name: Test OpenSSH Last login management
        run: sudo tests/test-last-login-management.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck \
            install.sh \
            etc/update-motd.d/10-server-info \
            tests/test-last-login-management.sh \
            usr/local/bin/server-info
